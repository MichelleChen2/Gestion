services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coopgestion
      POSTGRES_USER: coopgestion
      POSTGRES_PASSWORD: coopgestion
    ports:
      - "5432:5432"
    volumes:
      - coopgestion_pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coopgestion -d coopgestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://coopgestion:coopgestion@db:5432/coopgestion
      JWT_SECRET: desarrollo-coopgestion-cambiar-en-produccion
      FRONTEND_ORIGIN: http://localhost:3000
      MONOTRIBUTO_ALERT_DAYS: 5
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  coopgestion_pgdata:
